<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Ilustração de espetos de kafta e shish taouk na brasa sobre pão sírio com sumagre">
  <defs>
    <radialGradient id="grillBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#3c261c" />
      <stop offset="100%" stop-color="#190f0b" />
    </radialGradient>
    <linearGradient id="skewerMeat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c331e" />
      <stop offset="50%" stop-color="#9e482b" />
      <stop offset="100%" stop-color="#612313" />
    </linearGradient>
    <linearGradient id="chickenMeat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e59b49" />
      <stop offset="100%" stop-color="#a8591e" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#grillBg)" />

  <!-- Handcrafted Ceramic Platter -->
  <ellipse cx="400" cy="316" rx="330" ry="215" fill="#100805" opacity="0.6" />
  <ellipse cx="400" cy="300" rx="322" ry="205" fill="#f2eadc" stroke="#c18d3e" stroke-width="4" />
  <ellipse cx="400" cy="300" rx="292" ry="178" fill="#e6dac6" />

  <!-- Flatbread underneath -->
  <ellipse cx="400" cy="305" rx="245" ry="145" fill="#dec08e" stroke="#b6894c" stroke-width="2" />
  <ellipse cx="340" cy="270" rx="18" ry="9" fill="#b47838" opacity="0.4" />
  <ellipse cx="480" cy="335" rx="22" ry="11" fill="#b47838" opacity="0.4" />

  <!-- Kafta Skewers -->
  <g transform="translate(400, 235) rotate(-8)">
    <line x1="-255" y1="0" x2="255" y2="0" stroke="#a6a9ad" stroke-width="5" stroke-linecap="round" />
    <rect x="-185" y="-20" width="370" height="40" rx="18" fill="url(#skewerMeat)" />
    <path d="M-140 -20 V20 M-90 -20 V20 M-40 -20 V20 M10 -20 V20 M60 -20 V20 M110 -20 V20 M155 -20 V20" stroke="#3c150c" stroke-width="5" opacity="0.55" />
  </g>

  <g transform="translate(400, 300) rotate(-8)">
    <line x1="-255" y1="0" x2="255" y2="0" stroke="#a6a9ad" stroke-width="5" stroke-linecap="round" />
    <rect x="-185" y="-20" width="370" height="40" rx="18" fill="url(#skewerMeat)" />
    <path d="M-140 -20 V20 M-90 -20 V20 M-40 -20 V20 M10 -20 V20 M60 -20 V20 M110 -20 V20 M155 -20 V20" stroke="#3c150c" stroke-width="5" opacity="0.55" />
  </g>

  <!-- Shish Taouk Skewer -->
  <g transform="translate(400, 368) rotate(-8)">
    <line x1="-255" y1="0" x2="255" y2="0" stroke="#a6a9ad" stroke-width="5" stroke-linecap="round" />
    <rect x="-175" y="-21" width="60" height="42" rx="10" fill="url(#chickenMeat)" />
    <rect x="-105" y="-21" width="60" height="42" rx="10" fill="url(#chickenMeat)" />
    <rect x="-35" y="-21" width="60" height="42" rx="10" fill="url(#chickenMeat)" />
    <rect x="35" y="-21" width="60" height="42" rx="10" fill="url(#chickenMeat)" />
    <rect x="105" y="-21" width="60" height="42" rx="10" fill="url(#chickenMeat)" />
  </g>

  <!-- Charred Tomatoes, Parsley & Tahini Bowl -->
  <g transform="translate(195, 395)">
    <circle cx="0" cy="0" r="30" fill="#ba3222" />
    <circle cx="-6" cy="-6" r="10" fill="#e05643" opacity="0.6" />
    <circle cx="8" cy="8" r="7" fill="#2d0f0a" opacity="0.55" />
  </g>

  <g transform="translate(615, 215)">
    <circle cx="0" cy="4" r="46" fill="#120b07" opacity="0.35" />
    <circle cx="0" cy="0" r="44" fill="#fffaf2" stroke="#c18d3e" stroke-width="2" />
    <circle cx="0" cy="0" r="35" fill="#ede0c6" />
    <circle cx="0" cy="0" r="8" fill="#8b3a2b" opacity="0.7" />
  </g>

  <!-- Fresh Parsley Leaves -->
  <g fill="#4d6f32">
    <circle cx="245" cy="200" r="11" />
    <circle cx="262" cy="208" r="9" />
    <circle cx="560" cy="390" r="12" />
    <circle cx="578" cy="382" r="9" />
  </g>
</svg>
