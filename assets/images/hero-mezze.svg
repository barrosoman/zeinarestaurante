<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-label="Ilustração editorial de mesa síria com mezze, pão árabe, romã e arquitetura damascena">
  <defs>
    <radialGradient id="bgGlow" cx="72%" cy="48%" r="62%">
      <stop offset="0%" stop-color="#4e2e20" />
      <stop offset="55%" stop-color="#2a1912" />
      <stop offset="100%" stop-color="#180e0a" />
    </radialGradient>
    <radialGradient id="brassGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f0cd87" />
      <stop offset="55%" stop-color="#c18d3e" />
      <stop offset="100%" stop-color="#7c541b" />
    </radialGradient>
    <radialGradient id="hummusGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f2dfb4" />
      <stop offset="80%" stop-color="#dfc188" />
      <stop offset="100%" stop-color="#c4a266" />
    </radialGradient>
    <radialGradient id="muhammaraGrad" cx="48%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#c4472f" />
      <stop offset="75%" stop-color="#8b2b1a" />
      <stop offset="100%" stop-color="#5e1a0f" />
    </radialGradient>
    <radialGradient id="candleLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffdfa0" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffdfa0" stop-opacity="0" />
    </radialGradient>
    <pattern id="damaskPattern" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M40 4 L49 31 L76 40 L49 49 L40 76 L31 49 L4 40 L31 31 Z" fill="none" stroke="#c18d3e" stroke-opacity="0.12" stroke-width="1" />
      <circle cx="40" cy="40" r="10" fill="none" stroke="#c18d3e" stroke-opacity="0.1" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1440" height="900" fill="url(#bgGlow)" />
  <rect width="1440" height="900" fill="url(#damaskPattern)" />

  <!-- Damascene arched niche silhouette on right -->
  <path d="M840 900 V350 C840 190 965 110 1090 70 C1215 110 1340 190 1340 350 V900 Z" fill="#23140e" stroke="#c18d3e" stroke-opacity="0.32" stroke-width="2" />
  <path d="M875 900 V360 C875 220 980 148 1090 112 C1200 148 1305 220 1305 360 V900 Z" fill="none" stroke="#c18d3e" stroke-opacity="0.18" stroke-width="1.2" />

  <!-- Warm ambient candlelight pools -->
  <circle cx="940" cy="360" r="240" fill="url(#candleLight)" />
  <circle cx="1170" cy="560" r="220" fill="url(#candleLight)" />

  <!-- Large Brass Mezze Tray -->
  <g transform="translate(1070, 500)">
    <circle cx="0" cy="14" r="305" fill="#0e0705" opacity="0.55" />
    <circle cx="0" cy="0" r="298" fill="url(#brassGrad)" />
    <circle cx="0" cy="0" r="276" fill="#2b1b14" stroke="#e7c37c" stroke-width="2.5" stroke-opacity="0.65" />
    <circle cx="0" cy="0" r="262" fill="none" stroke="#c18d3e" stroke-width="1" stroke-dasharray="6 6" stroke-opacity="0.5" />

    <!-- Bowl 1: Hummus -->
    <g transform="translate(-105, -75)">
      <circle cx="0" cy="6" r="88" fill="#120a07" opacity="0.5" />
      <circle cx="0" cy="0" r="84" fill="#f6efe2" stroke="#c18d3e" stroke-width="2.5" />
      <circle cx="0" cy="0" r="72" fill="url(#hummusGrad)" />
      <path d="M-36 0 C-24 -28 24 -28 36 0 C22 24 -22 24 -36 0" fill="none" stroke="#b98a3b" stroke-width="4" opacity="0.6" />
      <circle cx="0" cy="0" r="14" fill="#a87c24" opacity="0.45" />
      <circle cx="-12" cy="-16" r="4.5" fill="#9c2c1b" />
      <circle cx="16" cy="12" r="4.5" fill="#9c2c1b" />
      <circle cx="6" cy="-6" r="5" fill="#e5c88e" />
      <circle cx="-8" cy="10" r="5" fill="#e5c88e" />
      <path d="M-4 0 C-10 -12 4 -18 10 -6 C4 0 -2 2 -4 0 Z" fill="#4f6b35" />
    </g>

    <!-- Bowl 2: Muhammara -->
    <g transform="translate(105, -70)">
      <circle cx="0" cy="6" r="82" fill="#120a07" opacity="0.5" />
      <circle cx="0" cy="0" r="78" fill="#f6efe2" stroke="#c18d3e" stroke-width="2.5" />
      <circle cx="0" cy="0" r="66" fill="url(#muhammaraGrad)" />
      <!-- Walnut & pomegranate garnish -->
      <ellipse cx="-14" cy="-8" rx="12" ry="8" fill="#b7824c" transform="rotate(-18 -14 -8)" />
      <ellipse cx="14" cy="10" rx="11" ry="7" fill="#a6723e" transform="rotate(24 14 10)" />
      <circle cx="8" cy="-18" r="4" fill="#e03a47" />
      <circle cx="-20" cy="16" r="4" fill="#e03a47" />
      <circle cx="24" cy="-8" r="3.5" fill="#e03a47" />
    </g>

    <!-- Bowl 3: Tabbouleh -->
    <g transform="translate(-85, 110)">
      <circle cx="0" cy="6" r="80" fill="#120a07" opacity="0.5" />
      <circle cx="0" cy="0" r="76" fill="#f6efe2" stroke="#566341" stroke-width="2.5" />
      <circle cx="0" cy="0" r="65" fill="#3f5929" />
      <circle cx="-18" cy="-12" r="14" fill="#547338" />
      <circle cx="16" cy="-14" r="16" fill="#4d6d32" />
      <circle cx="6" cy="18" r="15" fill="#5b7b3e" />
      <circle cx="-14" cy="20" r="6" fill="#c93b2b" />
      <circle cx="22" cy="8" r="6" fill="#c93b2b" />
      <circle cx="-4" cy="-22" r="5" fill="#c93b2b" />
      <circle cx="8" cy="-2" r="5" fill="#e2cf9f" />
    </g>

    <!-- Warm Pita / Khubz Bread Stack -->
    <g transform="translate(108, 108)">
      <circle cx="0" cy="6" r="86" fill="#120a07" opacity="0.45" />
      <circle cx="0" cy="0" r="82" fill="#dfc08c" stroke="#a67c46" stroke-width="2" />
      <circle cx="-8" cy="-6" r="76" fill="#ead1a4" stroke="#b98e55" stroke-width="1.5" />
      <ellipse cx="-24" cy="-18" rx="14" ry="8" fill="#b4793c" opacity="0.45" />
      <ellipse cx="18" cy="12" rx="18" ry="10" fill="#a86d33" opacity="0.4" />
      <ellipse cx="14" cy="-26" rx="10" ry="6" fill="#a86d33" opacity="0.35" />
    </g>

    <!-- Center Olive Oil & Mint Tea / Spice Dish -->
    <g transform="translate(0, 12)">
      <circle cx="0" cy="4" r="44" fill="#120a07" opacity="0.55" />
      <circle cx="0" cy="0" r="40" fill="url(#brassGrad)" />
      <circle cx="0" cy="0" r="30" fill="#5e6a32" />
      <circle cx="-8" cy="-6" r="7" fill="#3a451c" />
      <circle cx="10" cy="6" r="7" fill="#445020" />
      <circle cx="6" cy="-10" r="6" fill="#2d3614" />
    </g>
  </g>

  <!-- Floating Tea Glass & Pomegranate accents -->
  <g transform="translate(810, 690)">
    <circle cx="0" cy="8" r="42" fill="#0d0604" opacity="0.5" />
    <circle cx="0" cy="0" r="38" fill="#8b1e24" />
    <circle cx="-8" cy="-10" r="14" fill="#b72d34" opacity="0.6" />
    <path d="M-6 -38 L0 -50 L6 -38 Z" fill="#6b151a" />
  </g>
</svg>
